# Free hosting on Render — no credit card.
# Sleeps after ~15 min idle; wakes in ~1 min on next visit.
# WebSockets keep the free service awake while players are connected.
#
# Invite links are derived from the incoming request host, so no PUBLIC_URL
# is needed here — the service works on whatever domain Render assigns.

services:
  - type: web
    name: rpg-table
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: '*'
      - key: DATA_DIR
        value: /tmp/rpg-data
      - key: SESSION_TTL_MS
        value: '604800000'
