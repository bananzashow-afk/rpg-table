# fly.toml — always-on cloud host (works with PC off)
# Deploy: flyctl launch --copy-config --yes   then   flyctl deploy

app = 'rpg-table-purrple'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '3001'
  CORS_ORIGIN = '*'
  DATA_DIR = '/data'
  SESSION_TTL_MS = '604800000'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'rpg_data'
  destination = '/data'
